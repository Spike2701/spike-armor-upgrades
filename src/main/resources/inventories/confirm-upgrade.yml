title: "Confirm Upgrade"
rows: 3

# for disable set to "" (empty String)
sounds:
  opened: "ui.button.click"
  upgraded: "entity.villager.yes"

# slots here are clickable slots (plugin checks this on inventory click event)
# slots below (in items, e.g. items.1.slot) are slots of icons in gui
slots:
  cancel: 15
  confirm: 11

items:
  confirm:
    name: "<dark_green>Confirm"
    material: lime_wool
    slot: 11
    lore:
      - " <dark_gray>» <white>Click <gray>to confirm "

  cancel:
    name: "<dark_red>Cancel"
    material: red_wool
    slot: 15
    lore:
      - " <dark_gray>» <white>Click <gray>to cancel "