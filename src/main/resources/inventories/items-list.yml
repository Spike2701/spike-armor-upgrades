title: "Item List"
rows: 5

# for disable set to "" (empty String)
sounds:
  opened: "ui.button.click"

# slots here are clickable slots (plugin checks this on inventory click event)
# slots below (in items, e.g. items.1.slot) are slots of icons in gui
slots:
  back-button: 40

# in these slots items will not be added - useful if you are want to set empty slots
# (if you will add item below you don't have to but their slot here)
slot-blacklist: []

items:
  1:
    name: "<dark_red>Back"
    material: barrier
    slot: 40
    lore:
      - "<dark_gray>» <white>Click <gray>to go back"